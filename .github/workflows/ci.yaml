# M1 (Source & CI) and the delivery half of M2 (Pre-Merge Gate).
#
# The ordering here is the LLD's "cheap failures first" rule: tests run before the image
# is built, and the image is built before the gate runs. There is no point spending a
# container build on a change whose unit tests fail, and no point gating a change that
# could never be deployed.
#
# The gate binary decides; this workflow only delivers the verdict. That split is
# deliberate — the job's exit status becomes the status check, so a failure to post a
# comment can never turn a blocking verdict into a passing one.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The default token is read-only; each job requests exactly what it needs and nothing
# more. A workflow that can write to the repository is a workflow that can bypass the
# gate it is running.
permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same ref: a stale verdict on an older commit is
  # worse than no verdict, because it looks current.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: |
            app/go.sum
            gate/go.sum
            exporter/go.sum

      # Each module is vetted and tested independently. They are separate modules on
      # purpose — pricing is a shared leaf that both the control plane (M2) and the data
      # plane (M4) depend on, and neither depends on the other.
      - name: Test every module
        run: |
          for module in pricing app gate exporter dashboard; do
            echo "::group::$module"
            (cd "$module" && go vet ./... && go test ./...)
            echo "::endgroup::"
          done

  build:
    name: Build and publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: app
            context: app
            dockerfile: app/Dockerfile
          # The exporter builds from the repository root: it depends on the shared
          # pricing module through a relative replace directive, which a context of
          # exporter/ alone cannot reach.
          - image: cost-exporter
            context: .
            dockerfile: exporter/Dockerfile
          # The dashboard builds from dashboard/ alone. Unlike the exporter it shares no
          # module with the rest of the repository — it depends on nothing outside the
          # standard library — so the narrower context is the correct one.
          - image: demo-dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the image name
        id: image
        # Container registries require lowercase repository names, and this account has
        # capitals in it. Deriving the name from ${{ github.repository }} verbatim fails
        # the push with "repository name must be lowercase".
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Both architectures: CI runners are amd64 and the development cluster is an
          # arm64 Mac. A single-arch image would work in CI and fail to start locally.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record the digest
        run: |
          {
            echo "### Published image: ${{ matrix.image }}"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Pin manifests to this digest, never to the tag — a tag can be repointed"
            echo "at different bytes after the gate has approved it."
          } >> "$GITHUB_STEP_SUMMARY"

      # Matrix job outputs collapse to whichever leg finished last, so each leg writes its
      # digest to an artifact instead and the bump job collects all of them.
      - name: Hand the digest to the image-update job
        run: |
          mkdir -p digests
          printf '%s' "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.image }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          retention-days: 1

  gate:
    name: Cost and policy gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate compares against the merge base, so it needs history on both sides.
          # With the default shallow clone the base commit is simply not present, and the
          # gate cannot tell "nothing changed" from "I cannot see what changed".
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: gate/go.sum

      - name: Build the gate
        run: make gate-build

      - name: Evaluate
        id: evaluate
        # The exit status is captured rather than allowed to fail the step immediately,
        # so the report still reaches the pull request when the verdict is a block. A
        # gate that fails silently teaches people to ignore it.
        run: |
          set +e
          ./bin/gate evaluate \
            --config gate.yaml \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --output gate-report.md
          echo "verdict_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Publish the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat gate-report.md >> "$GITHUB_STEP_SUMMARY"
          # Replace the previous verdict rather than appending. On a long-running pull
          # request, appending buries the current verdict under a wall of stale ones.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file gate-report.md \
            --edit-last --create-if-none

      - name: Enforce the verdict
        # This is the status check. It runs last and depends on nothing but the gate's
        # own exit code: 0 pass, 1 blocked, 2 inconclusive (which also blocks, because
        # the platform never merges on uncertainty).
        run: |
          case "${{ steps.evaluate.outputs.verdict_exit }}" in
            0) echo "Gate passed." ;;
            1) echo "::error::Gate blocked this pull request. See the report comment."; exit 1 ;;
            2) echo "::error::Gate could not complete its evaluation, so it did not pass the change."; exit 1 ;;
            *) echo "::error::Gate exited unexpectedly (${{ steps.evaluate.outputs.verdict_exit }})."; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------------------
  # M1/M3 — close the image-update loop.
  #
  # Without this job, application code is the one change type that never reaches the
  # cluster: a manifest change merges and ArgoCD applies it, but a Go change merges, CI
  # publishes a new image, and nothing updates the digest that would deploy it. The result
  # is a new image that nothing references — which is why editing Go and watching nothing
  # happen was the expected behaviour rather than a bug.
  #
  # This opens a PULL REQUEST rather than writing to main or to the cluster. ArgoCD Image
  # Updater would do the latter, and that would make the one change type that alters what
  # actually runs the one change nobody reviews — the exact inverse of what this platform
  # argues for. A digest bump is a diff, and diffs go through the gate.
  # ---------------------------------------------------------------------------------------
  bump:
    name: Open a digest-bump pull request
    runs-on: ubuntu-latest
    needs: build
    # Only after a merge. On a pull request the image is published so the change can be
    # evaluated, but bumping a digest there would rewrite the branch under review.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # Deliberately read-only. The writing is done with a separate token, so this
      # workflow's own GITHUB_TOKEN never gains the ability to push to the repository it is
      # gating. main has no branch protection, so that restraint is doing real work.
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Rewrite the pinned digests
        run: bash tools/bump-digests.sh digests | tee bump.log

      - name: Decide what to do
        id: state
        env:
          BUMP_TOKEN: ${{ secrets.IMAGE_BUMP_TOKEN }}
        # Both facts are resolved here rather than in the `if:` of a later step, because a
        # step's own env block is not reliably visible to its own condition.
        run: |
          if git diff --quiet -- manifests/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Every manifest already pins the published digest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$BUMP_TOKEN" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "token=false" >> "$GITHUB_OUTPUT"
          fi

      # A pull request opened with the default GITHUB_TOKEN does not trigger workflows —
      # GitHub suppresses that to prevent runaway recursion. The consequence is specific and
      # unacceptable here: the bump would arrive as a pull request carrying no gate verdict,
      # which is the one kind of change this platform must never produce. So the job fails
      # loudly, and prints the exact diff it would have proposed so the bump can still be
      # made by hand.
      - name: Refuse to open an ungated pull request
        if: steps.state.outputs.changed == 'true' && steps.state.outputs.token == 'false'
        run: |
          {
            echo "### Digest bump needed, but not proposed"
            echo
            echo "A new image was published and the manifests still pin the previous digest,"
            echo "but no IMAGE_BUMP_TOKEN secret is configured."
            echo
            echo "A pull request opened with the default GITHUB_TOKEN does not trigger"
            echo "workflows, so it would carry no gate verdict. This job refuses to do that."
            echo
            echo "Fix: add a fine-grained personal access token as the repository secret"
            echo "IMAGE_BUMP_TOKEN, scoped to this repository with Contents: read and write"
            echo "and Pull requests: read and write."
            echo
            echo "The change it would have proposed:"
            echo '```'
            cat bump.log
            echo '```'
            echo '```diff'
            git diff -- manifests/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Digest bump needed but IMAGE_BUMP_TOKEN is not configured. The run summary contains the exact change."
          exit 1

      - name: Propose the bump
        if: steps.state.outputs.changed == 'true' && steps.state.outputs.token == 'true'
        env:
          GH_TOKEN: ${{ secrets.IMAGE_BUMP_TOKEN }}
        run: |
          BRANCH=automation/image-digests
          git config user.name  "gitops-platform-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add manifests/
          git commit -F - <<'MSG'
          Pin the manifests to the images CI just published

          Opened automatically after a merge to main. Application code changes otherwise
          never reach the cluster: CI publishes a new image and nothing updates the digest
          that would deploy it, so the new image exists and nothing references it.

          This is a proposal, not a deployment. It passes through the cost and policy gate
          like any other change.
          MSG
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Force-push the same branch every time, so a run of merges keeps one pull request
          # current rather than accumulating a queue of stale ones.
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Pin the manifests to the images CI just published" \
              --body-file - <<'BODY'
          Opened automatically after a merge to `main`.

          Application code changes otherwise never reach the cluster. CI publishes a new
          image on every merge, but the manifests pin a digest and nothing updated it — so a
          new image existed that nothing referenced.

          This is a **proposal**, not a deployment. It carries a gate verdict like any other
          change. ArgoCD Image Updater was rejected for the opposite reason: writing straight
          to the cluster or to `main` would make the one change type that alters what
          actually runs the one change nobody reviews.
          BODY
          else
            echo "Updated the existing pull request."
          fi
          {
            echo "### Digest bump proposed"
            echo
            echo '```'
            cat bump.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
