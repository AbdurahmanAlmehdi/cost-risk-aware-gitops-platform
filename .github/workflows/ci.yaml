# M1 (Source & CI) and the delivery half of M2 (Pre-Merge Gate).
#
# The ordering here is the LLD's "cheap failures first" rule: tests run before the image
# is built, and the image is built before the gate runs. There is no point spending a
# container build on a change whose unit tests fail, and no point gating a change that
# could never be deployed.
#
# The gate binary decides; this workflow only delivers the verdict. That split is
# deliberate — the job's exit status becomes the status check, so a failure to post a
# comment can never turn a blocking verdict into a passing one.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The default token is read-only; each job requests exactly what it needs and nothing
# more. A workflow that can write to the repository is a workflow that can bypass the
# gate it is running.
permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same ref: a stale verdict on an older commit is
  # worse than no verdict, because it looks current.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: |
            app/go.sum
            gate/go.sum
            exporter/go.sum

      # Each module is vetted and tested independently. They are separate modules on
      # purpose — pricing is a shared leaf that both the control plane (M2) and the data
      # plane (M4) depend on, and neither depends on the other.
      - name: Test every module
        run: |
          for module in pricing app gate exporter; do
            echo "::group::$module"
            (cd "$module" && go vet ./... && go test ./...)
            echo "::endgroup::"
          done

  build:
    name: Build and publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: app
            context: app
            dockerfile: app/Dockerfile
          # The exporter builds from the repository root: it depends on the shared
          # pricing module through a relative replace directive, which a context of
          # exporter/ alone cannot reach.
          - image: cost-exporter
            context: .
            dockerfile: exporter/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the image name
        id: image
        # Container registries require lowercase repository names, and this account has
        # capitals in it. Deriving the name from ${{ github.repository }} verbatim fails
        # the push with "repository name must be lowercase".
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Both architectures: CI runners are amd64 and the development cluster is an
          # arm64 Mac. A single-arch image would work in CI and fail to start locally.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record the digest
        run: |
          {
            echo "### Published image: ${{ matrix.image }}"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Pin manifests to this digest, never to the tag — a tag can be repointed"
            echo "at different bytes after the gate has approved it."
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Cost and policy gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate compares against the merge base, so it needs history on both sides.
          # With the default shallow clone the base commit is simply not present, and the
          # gate cannot tell "nothing changed" from "I cannot see what changed".
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: gate/go.sum

      - name: Build the gate
        run: make gate-build

      - name: Evaluate
        id: evaluate
        # The exit status is captured rather than allowed to fail the step immediately,
        # so the report still reaches the pull request when the verdict is a block. A
        # gate that fails silently teaches people to ignore it.
        run: |
          set +e
          ./bin/gate evaluate \
            --config gate.yaml \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --output gate-report.md
          echo "verdict_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Publish the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat gate-report.md >> "$GITHUB_STEP_SUMMARY"
          # Replace the previous verdict rather than appending. On a long-running pull
          # request, appending buries the current verdict under a wall of stale ones.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file gate-report.md \
            --edit-last --create-if-none

      - name: Enforce the verdict
        # This is the status check. It runs last and depends on nothing but the gate's
        # own exit code: 0 pass, 1 blocked, 2 inconclusive (which also blocks, because
        # the platform never merges on uncertainty).
        run: |
          case "${{ steps.evaluate.outputs.verdict_exit }}" in
            0) echo "Gate passed." ;;
            1) echo "::error::Gate blocked this pull request. See the report comment."; exit 1 ;;
            2) echo "::error::Gate could not complete its evaluation, so it did not pass the change."; exit 1 ;;
            *) echo "::error::Gate exited unexpectedly (${{ steps.evaluate.outputs.verdict_exit }})."; exit 1 ;;
          esac
