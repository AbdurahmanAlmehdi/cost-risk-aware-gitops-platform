apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo

resources:
  - deployment.yaml
  - podmonitor.yaml
  - networkpolicy.yaml
  - service.yaml

# The single line CI rewrites on every merge, and the single line M2 reads to know
# exactly which image a pull request intends to deploy. Keeping the image reference in
# one declarative field, rather than inline in the Deployment, is what lets an
# automated image update be a one-line, reviewable diff.
images:
  - name: demo-app
    newName: ghcr.io/abdurahmanalmehdi/cost-risk-aware-gitops-platform/app
    # Pinned to a digest, never a tag. A tag is a mutable pointer: the bytes behind it can
    # be replaced after M2 has approved them, so everything the gate checked would describe
    # an artefact that is no longer the one being deployed. The digest is what makes
    # "what M2 evaluated is what M3 deploys" a guarantee rather than an intention.
    #
    # This is the one line CI rewrites when publishing a new image, which keeps an image
    # update a one-line, reviewable diff that passes through the gate like any other change.
    digest: sha256:122d74a0a328a51fd2c76c0637d1a55738a79c36ef3a5f24ceeb6e2011bd5f9d
