# The producer tier's permitted paths.
#
# This is the only workload in the namespace deliberately reachable from outside the
# cluster. It is the front door, and the load generator drives it through a NodePort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-api-allow
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: demo
    gitops-platform.io/module: m6
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traffic arriving from the node network, a NodePort connection, or a
    # `kubectl port-forward` relayed by the kubelet.
    #
    # It does not arrive with the client's address. kube-proxy source-NATs NodePort
    # traffic to the receiving node, and port-forward originates from the kubelet, so as
    # far as policy is concerned both come from the node network. That is why this is an
    # ipBlock and not a podSelector: neither has pod labels to select on.
    #
    # These are the RFC1918 ranges a cluster's own nodes occupy - 172.16/12 covers kind's
    # Docker network, 10/8 covers a DigitalOcean VPC, 192.168/16 covers common bare-metal
    # setups. Listing all three keeps the manifest portable across every environment the
    # platform runs on, which matters because the alternative failure is silent: on a
    # cluster whose node subnet is not listed, the front door is simply dead and the load
    # generator times out with nothing to indicate why.
    #
    # The cost is that this permits any private-network source on port 8080 rather than
    # strictly the node subnet. It is still emphatically not 0.0.0.0/0. GATE-017 blocks
    # that, and rightly, since "reachable from the internet" must never be something a
    # pod-level allow-list can quietly grant. The rigorous alternative is a kustomize
    # overlay per environment carrying the exact subnet; that is the right answer for a
    # production estate and disproportionate for one demonstration workload.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 8080

    # Prometheus scrapes the pod directly through a PodMonitor, so the connection comes
    # from the observability namespace. Without this the metrics simply stop, and the
    # dashboards go flat in a way that looks like the workload costing nothing rather
    # than like a blocked connection.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080


    # The demo dashboard, which drives load tests on the reviewer's behalf.
    #
    # This is why the job endpoint needs no public hostname of its own: the dashboard sits
    # behind authentication and calls it from inside the cluster, so the one endpoint that
    # can drive spending is never reachable from the internet at all.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # The queue, and nothing else. DNS is granted namespace-wide by the baseline.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
