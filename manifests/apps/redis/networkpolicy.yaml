# Who may reach the queue.
#
# Redis is the most valuable target in the namespace: it holds the work, and it has no
# authentication in this deployment. Under the default-deny baseline it is unreachable by
# anything not named here.
#
# Note what is *absent*: demo-api cannot reach demo-worker, nothing outside the cluster can
# reach Redis at all, and no other namespace can either — apart from the one that
# genuinely needs to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-queue-clients
  namespace: demo
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: demo
    gitops-platform.io/module: m6
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The producer and the consumer — the only two application components with any
        # business talking to the queue.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: demo-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: demo-worker

        # KEDA, and this one is easy to miss.
        #
        # The Redis scaler does not read queue depth through the application or through
        # Prometheus — the KEDA operator opens its own connection to Redis and runs LLEN
        # itself. Omitting this rule does not produce an obvious error: the ScaledObject
        # simply stops reporting a metric, the HPA reads "unknown", and the workload quietly
        # stops scaling. M5 would appear broken for a reason that lives entirely in M6.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 6379
