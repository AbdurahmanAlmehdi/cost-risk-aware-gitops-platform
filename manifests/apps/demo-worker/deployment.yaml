# M1 workload, the consumer tier, and the target of M5's autoscaling.
#
# This is the expensive workload: its replica count is what KEDA changes, its CPU is
# what M4 prices, and the correlation between the two is what M7 plots. Everything
# about it is sized so that a scale event produces a visible, explainable cost movement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-worker
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: demo
spec:
  # Baseline only. Once M5 is installed its ScaledObject owns this field, and the value
  # here becomes the count the cluster returns to when demand disappears.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: demo
    spec:
      # Prefer the application node pool, but do not require it.
      #
      # Isolation from the platform tier is enforced by that node's NoSchedule taint,
      # which these pods do not tolerate. This label was only ever a hint about where
      # they belong. As a hard nodeSelector it also made single-node clusters impossible,
      # since one node cannot carry two values of the same label key, so a review host or
      # CI runner could never schedule the application at all.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload
                    operator: In
                    values: ["apps"]
      # A worker finishes its current job before exiting, so termination must be given
      # room. This exceeds the queue's 5s blocking-pop timeout plus the longest
      # reasonable job, which is what makes a scale-down lossless rather than lossy.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: demo-app
          command: ["/worker"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_ADDR
              value: redis.demo.svc.cluster.local:6379
            - name: CONCURRENCY
              # One job at a time per pod, so throughput is a straight multiple of
              # replica count and a scale event has an unambiguous reading.
              value: "1"
          resources:
            requests:
              # The dominant cost driver in the whole platform. At the pricing table's
              # rate this is roughly $11.50/month per replica, which is large enough
              # that a scale-up is clearly visible on the cost dashboard and in a
              # pull-request cost delta.
              cpu: 500m
              memory: 64Mi
            limits:
              memory: 128Mi
              # Equal to the request, so a worker can never take more CPU than it was
              # priced for.
              #
              # Without this the worker was capped on memory but unbounded on CPU, and its
              # jobs are real work, work.Do() runs sha256 until the deadline rather than
              # sleeping, deliberately, so the CPU trigger has something to read. Six of
              # them on a four-core node therefore consumed every core the scheduler would
              # give them, and Prometheus and Grafana were starved alongside everything
              # else. The load test ran, the platform scaled correctly, and the dashboard
              # the whole demonstration is watched on stopped answering.
              #
              # It also made the cost figures a fiction in the one direction that matters:
              # M2 prices a replica at its request, so a workload free to exceed that
              # request is one the estimate cannot bound. Requests are a scheduling hint,
              # not a ceiling; this is the ceiling.
              #
              # Draining 600 jobs takes marginally longer capped at three cores than
              # uncapped at four, which is a fair trade for a dashboard that survives the
              # act it exists to illustrate.
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          # No readiness probe: the worker pulls work rather than receiving it, so it
          # is never in a Service's endpoints and readiness would have no consumer.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
