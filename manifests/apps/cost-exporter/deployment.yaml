# M4, live cost attribution.
#
# Read-only by construction (LLD §4.2): it queries Prometheus over HTTP and holds no
# Kubernetes credentials at all, no ServiceAccount token is mounted, so there is no API
# it could mutate even if it wanted to. The module that reports on spend cannot influence
# what is spent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: cost-exporter
    app.kubernetes.io/component: finops
    app.kubernetes.io/part-of: gitops-platform
spec:
  # One replica. Two would compute and publish identical series, and Prometheus would
  # scrape both, doubling every cost figure on the dashboard.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cost-exporter
        app.kubernetes.io/component: finops
        app.kubernetes.io/part-of: gitops-platform
    spec:
      nodeSelector:
        workload: platform
      tolerations:
        - key: workload
          operator: Equal
          value: platform
          effect: NoSchedule
      # No API access is needed, so none is granted.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: cost-exporter
          ports:
            - name: metrics
              containerPort: 9091
          env:
            - name: PROMETHEUS_URL
              value: http://observability-kube-prometh-prometheus.observability.svc:9090
            - name: PRICING_PATH
              value: /etc/gitops-platform/pricing.yaml
            - name: COLLECT_INTERVAL
              value: 30s
            # The averaging window for CPU rate. Long enough that a single burst does not
            # whipsaw the cost line, short enough that a scale event shows up while the
            # load that caused it is still visible on the same screen.
            - name: RATE_WINDOW
              value: 2m
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          # No readiness probe: nothing routes traffic here. Prometheus scrapes the pod
          # directly through a PodMonitor, so this workload is never in a Service's
          # endpoint list and readiness would have no consumer.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pricing
              mountPath: /etc/gitops-platform
              readOnly: true
      volumes:
        - name: pricing
          configMap:
            name: pricing-table
