apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

# Every file has to be listed here. kustomize ignores anything it is not told about,
# silently and without warning, a manifest can be committed, reviewed, merged and
# deployed while doing absolutely nothing, because nothing ever reads it.
resources:
  - deployment.yaml
  - podmonitor.yaml
  - dashboard.yaml

# The pricing table is delivered to the cluster as a ConfigMap generated from the very
# same file M2 reads to price pull requests. It lives inside this kustomize root because
# kustomize refuses to read files outside its root, and a copy kept elsewhere would be a
# second source of truth, which is the one thing this table must never have.
#
# The generated name carries a content hash, so editing a rate produces a new ConfigMap
# name, which rolls the exporter automatically. Without the hash the exporter would keep
# serving figures computed from rates that are no longer in Git.
configMapGenerator:
  - name: pricing-table
    files:
      - pricing.yaml

images:
  - name: cost-exporter
    newName: ghcr.io/abdurahmanalmehdi/cost-risk-aware-gitops-platform/cost-exporter
    digest: sha256:eeaa4226fa7062c6a95560c259525418c31a7d35b5283c11aae03b14ef8aa165
