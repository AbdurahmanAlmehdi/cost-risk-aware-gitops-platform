apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: edge
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/component: edge-router
    app.kubernetes.io/part-of: gitops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
        app.kubernetes.io/component: edge-router
        app.kubernetes.io/part-of: gitops-platform
      annotations:
        # Roll the pod when the routing or credentials change. A ConfigMap edit alone does
        # not restart anything, so without this Caddy would keep serving the old routes and
        # the old password long after Git said otherwise.
        gitops-platform.io/config-hash: "caddyfile-v1"
    spec:
      # No API access whatsoever. Caddy forwards packets; it has no business holding a
      # token for the cluster it is the front door to.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The image ships /usr/bin/caddy with a file capability (cap_net_bind_service=ep).
      # allowPrivilegeEscalation: false sets no_new_privs, and the kernel refuses to exec a
      # file carrying capabilities while that is set, so the container died with
      # "exec /usr/bin/caddy: operation not permitted" before Caddy could log anything.
      #
      # Caddy binds 8080 and 8081 here. Both are unprivileged, so the capability the image
      # ships is dead weight in this deployment. Copying the binary drops it, because file
      # capabilities are not preserved by cp, which keeps every restriction in place rather
      # than trading one away. Raising allowPrivilegeEscalation would satisfy the kernel and
      # violate GATE-005's sibling GATE-010, and would be a real loosening to work around a
      # capability that is not even wanted.
      initContainers:
        - name: strip-file-capabilities
          image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          command: ["cp", "/usr/bin/caddy", "/opt/caddy/caddy"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bin
              mountPath: /opt/caddy
      containers:
        - name: caddy
          image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          # command, not args: the image's entrypoint is the very binary being avoided, so
          # leaving it in place would exec the capability-bearing copy no matter what
          # arguments followed.
          command: ["/opt/caddy/caddy"]
          args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            # A Service routes to this pod, so readiness is required. Both by Kubernetes,
            # to avoid sending traffic to a Caddy still parsing its config, and by the
            # platform's own GATE-006.
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bin
              mountPath: /opt/caddy
              readOnly: true
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: cfg-home
              mountPath: /config
      volumes:
        # Holds the de-capabilitised copy of the Caddy binary. emptyDir, so it is recreated
        # from the image on every start and cannot drift from what the digest describes.
        - name: bin
          emptyDir: {}
        - name: config
          configMap:
            name: caddy-config
        # Caddy writes state even with automatic HTTPS disabled, and the root filesystem is
        # read-only, so both paths need somewhere writable that does not outlive the pod.
        - name: data
          emptyDir: {}
        - name: cfg-home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: edge
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/part-of: gitops-platform
spec:
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - name: http
      port: 8080
      targetPort: http
