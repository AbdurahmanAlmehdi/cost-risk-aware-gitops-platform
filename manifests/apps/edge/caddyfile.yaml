# Caddy is the cluster's internal router. Authentication happens in front of it, at
# Cloudflare Access.
#
# cloudflared forwards every routed hostname here, so all routing lives in a single place
# rather than being split across two components with different config formats.
#
# Caddy used to hold a shared basic-auth password as well. That was a placeholder from
# before Access was configured, and its own comment called it the weaker half of the
# design: no identity, no MFA, no per-person revocation, no audit trail. Access now
# provides all four, authenticating each reviewer individually by one-time PIN against an
# explicit allow-list.
#
# Keeping both was not defence in depth, because the two layers do not fail independently:
# a request only reaches Caddy through the tunnel, so anything that satisfies Access has
# already crossed the only path in. What the shared password added was a second credential
# handed to every reviewer out-of-band — one more thing to distribute, forget, and never
# be able to revoke for one person. It was removed for that reason, not to save a step.
#
# This is safe only while Caddy is unreachable except through the tunnel. Its Service is
# ClusterIP with no node port, which is what makes that true; exposing it directly would
# put ArgoCD on the internet with no authentication at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: edge
data:
  Caddyfile: |
    {
      # Cloudflare terminates TLS at its edge and cloudflared forwards plain HTTP over the
      # tunnel, so Caddy must not try to obtain certificates of its own — it would fail the
      # ACME challenge, since nothing can reach it directly.
      auto_https off
      # The admin API can reconfigure the server at runtime. Nothing here uses it, and an
      # unauthenticated control plane inside the one pod exposed to the internet is exactly
      # the kind of thing that turns a small mistake into a large one.
      admin off
      servers {
        # Trust the tunnel's forwarded client address so logs and any future rate limiting
        # see the real visitor rather than the cloudflared pod.
        trusted_proxies static private_ranges
      }
    }

    # Liveness only. Deliberately unauthenticated and deliberately not routed by the tunnel:
    # it is reachable from inside the cluster, never from outside.
    :8081 {
      respond /healthz "ok" 200
      respond * "not found" 404
    }

    :8080 {
      log {
        output stdout
        format console
      }

      @gitops host gitops.abdurahman.ly
      handle @gitops {
        reverse_proxy demo-dashboard.edge.svc.cluster.local:8080
      }

      @argocd host argocd.abdurahman.ly
      handle @argocd {
        # ArgoCD runs with server.insecure, so it speaks plain HTTP inside the cluster.
        # The hop from Cloudflare to here is TLS; this last hop stays inside the cluster.
        reverse_proxy argocd-server.argocd.svc.cluster.local:80
      }

      @grafana host grafana.abdurahman.ly
      handle @grafana {
        reverse_proxy observability-grafana.observability.svc.cluster.local:80
      }

      # Anything not explicitly routed is refused rather than guessed at. A default that
      # forwarded somewhere would make a typo'd hostname silently reach a real service.
      handle {
        respond "no application is routed at this hostname" 404
      }
    }
