apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace transformer here, unlike the other applications.
#
# This is the one component whose resources deliberately span three namespaces: the
# workload runs in edge, but its Roles and RoleBindings must be created in demo and argocd,
# because that is where the resources they grant access to live. A `namespace: edge`
# directive rewrites all of them to edge — which collapses the two Roles into one name and
# produces a build-time ID conflict, and would otherwise have granted nothing at all.
# Every file below states its own namespace explicitly instead.

# Every file listed explicitly — kustomize ignores what it is not told about, silently,
# which has already cost this project one dashboard that deployed and did nothing.
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

images:
  - name: demo-dashboard
    newName: ghcr.io/abdurahmanalmehdi/cost-risk-aware-gitops-platform/demo-dashboard
    # Pinned to a digest, never a tag. A tag is a mutable pointer: the bytes behind it can
    # be replaced after M2 has approved them, so everything the gate checked would describe
    # an artefact that is no longer the one being deployed. The digest is what makes
    # "what M2 evaluated is what M3 deploys" a guarantee rather than an intention.
    #
    # This is the one line CI rewrites when publishing a new image, which keeps an image
    # update a one-line, reviewable diff that passes through the gate like any other change.
    digest: sha256:1ad9fc120f1eadfb1d5fad9fe57ec4a52a1afc03c104cb4424b36402fc015913
