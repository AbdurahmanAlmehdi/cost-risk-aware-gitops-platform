# The edge stack: the tunnel connector and the router that authenticates in front of it.
#
# Wave 2, after the applications it routes to. Bringing the front door up before the rooms
# exist would serve 502s to whoever happened to be watching.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AbdurahmanAlmehdi/cost-risk-aware-gitops-platform.git
    targetRevision: main
    path: manifests/apps/edge
  destination:
    server: https://kubernetes.default.svc
    namespace: edge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
