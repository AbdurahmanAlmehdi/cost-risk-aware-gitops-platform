# M3 — GitOps delivery control plane.
#
# ArgoCD is the only component in the platform that holds cluster write credentials. CI
# holds none: delivery is pull-based, so a compromised pipeline cannot deploy to the
# cluster (LLD §9.4). Everything ArgoCD applies has already passed M2.

global:
  # ArgoCD is platform infrastructure, so it runs on the tainted platform node alongside
  # Redis. Keeping it off the apps node means M5 can scale workers freely without ever
  # contending with the controller that is reconciling them.
  nodeSelector:
    workload: platform
  tolerations:
    - key: workload
      operator: Equal
      value: platform
      effect: NoSchedule

configs:
  params:
    # Terminate TLS at the NodePort rather than inside the server. This is a local
    # development cluster reached over a kind port mapping; running the server in
    # insecure mode avoids a self-signed-certificate redirect loop in the browser.
    # It would not be acceptable on a shared cluster.
    server.insecure: true

  cm:
    # How often each Application is re-compared against Git, when no webhook has fired.
    #
    # Raised from the 180s default once the platform reached nine Applications. Each
    # reconciliation lists and diffs every resource an Application owns, and that load
    # lands on the API server: at 180s the controller alone drove the apiserver to over
    # two cores on this cluster and started timing out requests for everything else.
    #
    # The cost of the longer interval is bounded and small — a merge takes at most five
    # minutes to appear rather than three — and it only applies when no webhook is
    # configured, which is the case here because the cluster is not reachable from GitHub.
    timeout.reconciliation: 300s

    # Ignore the replica count on Deployments that a ScaledObject owns.
    #
    # Without this, M3 and M5 fight: KEDA scales demo-worker to 6, ArgoCD sees live state
    # diverge from Git (which says 1), and self-heal scales it straight back down. The
    # symptom is a workload that oscillates under load and an autoscaler that appears not
    # to work. This is the concrete boundary from the LLD — M5 owns *scale*, M3 owns
    # *existence* — expressed as a diff exclusion.
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jqPathExpressions:
        - '.spec.replicas'

server:
  service:
    type: NodePort
    # Mapped to http://localhost:8080 by platform/kind/cluster.yaml.
    nodePortHttp: 30080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 100m
      # Measured at ~547Mi with the current application set. The previous 256Mi request
      # meant the scheduler reserved less than half of what this actually holds, so the
      # node was overcommitted by exactly the amount nobody had accounted for — the same
      # requested-versus-actual gap M4 exists to surface, found in the platform itself.
      memory: 576Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      # Raised from 50m after the repo-server crash-looped 33 times.
      #
      # It was not out of memory — it was failing its liveness probe. Rendering Helm
      # charts is CPU-bound, and once the platform started delivering kube-prometheus-
      # stack, KEDA and metrics-server from charts rather than plain manifests, 50m of
      # guaranteed CPU was no longer enough to answer /healthz before the probe timed
      # out. The kubelet then killed it, which dropped every Application to Unknown
      # because nothing could render the desired state.
      #
      # The lesson is about requests, not about ArgoCD: the workload's profile changed
      # when its responsibilities did, and the reservation set for the old profile
      # silently became wrong.
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# Components the platform does not use. Each one disabled is memory returned to the
# workloads being measured — this cluster runs on a laptop, and an idle component still
# occupies the node whose cost M4 is attributing.
dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  # This chart exposes no `enabled` key for the ApplicationSet controller — only
  # `replicas`. Setting `applicationSet.enabled: false` is accepted silently by Helm and
  # does nothing, which reads as disabled while the controller keeps running. Scaling to
  # zero is the toggle that actually exists.
  replicas: 0
